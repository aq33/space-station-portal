<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Station Portal</title>
<link rel="stylesheet" href="styl.css">
</head>
<body>
<header id="gora">
  <h1>Space Station Portal</h1>
  <nav id="zakladki" class="grupa">
    <button data-zakladka="sprite" class="aktywny">Sprite'y</button>
    <button data-zakladka="dzwieki">Dźwięki</button>
  </nav>
  <input id="szukaj" type="search" placeholder="Szukaj przedmiotu, np. crowbar, captain, /obj/item/gun" autocomplete="off" autofocus>
  <span class="tylko-dzwieki">
    <select id="dzTryb" title="Które dźwięki pokazać">
      <option value="wszystkie">Wszystkie dźwięki</option>
      <option value="nowe">Nowe – tylko w jednym repo</option>
      <option value="rozne">Różne wersje tego samego</option>
      <option value="uzywane">Używane przez kod</option>
      <option value="nieuzywane">Nieużywane przez kod</option>
      <option value="brakujace">Brakujące pliki (kod odwołuje się do nieistniejącego)</option>
    </select>
    <label id="dzRepoEtykieta">w <select id="dzRepo"></select></label>
  </span>
  <div id="kryteria" class="kryteria tylko-sprite" title="Po czym szukać odpowiedników w innych repo"><span>Porównuj po:</span></div>
  <details id="opcje" class="rozwijane tylko-sprite">
    <summary class="przycisk">Widok ▾</summary>
    <div class="menu">
      <label>Wiersze z <select id="zrodloWierszy"></select></label>
      <label>Rozmiar sprite'ów
        <select id="skala"><option value="1">mały (1×)</option><option value="2">średni (2×)</option><option value="3">duży (3×)</option></select>
      </label>
      <label>Tło <select id="tloTabeli">
        <option value="szachownica">szachownica</option><option value="ciemne">ciemne</option><option value="jasne">jasne</option><option value="podloga">podłoga</option>
      </select></label>
      <label class="pole"><input id="tylkoZOdp" type="checkbox"> Tylko przedmioty, które mają odpowiednik</label>
    </div>
  </details>
  <button id="pomoc" class="przycisk pomoc" title="Jak działa wyszukiwanie i porównywanie">? Jak to działa</button>
</header>

<div id="repa"></div>

<div id="uklad">
  <aside id="boczny">
    <div id="listaKategorii"></div>
  </aside>
  <div id="srodek">
    <div id="opisWidoku"></div>
    <div id="podgrupy"></div>
    <main id="tabela" class="tylko-sprite">
      <div id="naglowkiTabeli" class="wiersz naglowki"></div>
      <div id="wiersze"></div>
      <div id="stopka"></div>
    </main>
    <main id="dzwieki" class="tylko-dzwieki tabela">
      <div id="dzwiekiNaglowki" class="wiersz naglowki"></div>
      <div id="dzwiekiWiersze"></div>
      <div id="dzwiekiStopka" class="stopka"></div>
    </main>
  </div>
</div>

<dialog id="szczegoly">
  <div class="szczegoly">
    <div id="pasek">
      <div id="tytul"></div>
      <div class="grupa" id="widoki">
        <button data-widok="s" class="aktywny">Ikona</button>
        <button data-widok="r">W rękach</button>
        <button data-widok="w">Na postaci</button>
      </div>
      <div class="grupa" id="kierunki">
        <button data-kier="0" class="aktywny" title="Południe">S</button>
        <button data-kier="1" title="Północ">N</button>
        <button data-kier="2" title="Wschód">E</button>
        <button data-kier="3" title="Zachód">W</button>
        <button data-kier="-1" title="Wszystkie kierunki obok siebie">Wszystkie</button>
      </div>
      <label class="grupa">Powiększenie <input id="zoom" type="range" min="1" max="10" value="5"><span id="zoomWartosc">5×</span></label>
      <div class="grupa" id="tla">
        <button data-tlo="szachownica" class="aktywny">Szachownica</button>
        <button data-tlo="ciemne">Ciemne</button>
        <button data-tlo="jasne">Jasne</button>
        <button data-tlo="podloga">Podłoga</button>
      </div>
      <button id="animacja" class="przycisk" title="Spacja">⏸ Animacja</button>
      <span class="odstep"></span>
      <button id="poprzedni" class="przycisk" title="Poprzedni wiersz (↑)">↑</button>
      <button id="nastepny" class="przycisk" title="Następny wiersz (↓)">↓</button>
      <button id="zamknij" class="przycisk" title="Zamknij (Esc)">✕</button>
    </div>
    <div id="karty"></div>
  </div>
</dialog>

<dialog id="oknoRepo">
  <form method="dialog" class="okno">
    <h2>Dodaj repozytorium</h2>
    <section class="sposob">
      <h3>Z GitHuba</h3>
      <p>Wklej link do repo. Pobierze się tylko kod i grafika, bez dźwięków i map (kilkaset MB, kilka minut).</p>
      <div class="rzad">
        <input id="urlRepo" placeholder="https://github.com/tgstation/tgstation" autocomplete="off">
        <button id="pobierzRepo" value="" class="przycisk glowny">Pobierz</button>
      </div>
    </section>
    <section class="sposob">
      <h3>Z dysku</h3>
      <p>Folder z plikiem <code>.dme</code> i folderem <code>icons</code> (SS13) albo z <code>Resources</code> (SS14).</p>
      <div class="rzad">
        <input id="sciezkaRepo" placeholder="C:\Users\...\tgstation" autocomplete="off">
        <button id="wybierzFolder" value="" class="przycisk" type="button">Wybierz folder…</button>
        <button id="zatwierdzRepo" value="" class="przycisk glowny">Dodaj</button>
      </div>
      <div id="propozycje"></div>
    </section>
    <label>Nazwa kolumny (opcjonalnie) <input id="nazwaRepo" placeholder="np. tg" autocomplete="off"></label>
    <p id="bladRepo" class="blad"></p>
    <div class="przyciski"><button value="anuluj" class="przycisk">Zamknij</button></div>
  </form>
</dialog>

<dialog id="oknoWybor">
  <div class="okno">
    <h2 id="wyborTytul">Wybierz odpowiednik</h2>
    <input id="wyborSzukaj" type="search" placeholder="Szukaj w tym repo" autocomplete="off">
    <ul id="wyborLista"></ul>
    <div class="przyciski"><button id="wyborZamknij" class="przycisk">Zamknij</button></div>
  </div>
</dialog>

<div id="menuRepo" class="menu plywajace" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
